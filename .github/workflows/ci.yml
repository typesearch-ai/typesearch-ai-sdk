name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}, ai ${{ matrix.ai }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, ai: 6 }
          - { node: 22, ai: 7 }
          - { node: 24, ai: 7 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.ai == 6
        run: npm install --no-save ai@6
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      # ESM and CommonJS types resolve right in every TypeScript mode (node10, node16, bundler).
      - run: npx -y @arethetypeswrong/cli@0 --pack .
